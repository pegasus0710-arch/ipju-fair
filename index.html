<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1f4d">
<title>충청 입주박람회 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#111827; --sub:#5b6474; --mute:#9aa3b2; --line:#e5e8ee; --line2:#f0f2f6;
  --navy:#0b1f4d; --blue:#1d4ed8; --blue-soft:#e8efff;
  --good:#0f9d58; --good-soft:#e6f6ee; --warn:#d97706; --warn-soft:#fff4e0; --bad:#dc2626; --bad-soft:#fdeaea;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ===== lock ===== */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0b1f4d,#163a8a);padding:24px;z-index:60}
#lock .box{width:100%;max-width:360px;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#lock h1{margin:0 0 4px;font-size:20px}
#lock p{margin:0 0 20px;color:var(--sub);font-size:14px}
#lock input[type=password]{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;outline:none}
#lock input[type=password]:focus{border-color:var(--blue)}
#lock .row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14px;color:var(--sub)}
#lock .go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
#lock .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}

/* ===== mobile shell ===== */
header.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
header.top .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
header.top small{opacity:.7;font-size:12px}
.ghost{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button[data-t]{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button[data-t] svg{width:22px;height:22px}
nav.tabs button[data-t].on{color:var(--navy);font-weight:700}
.side-only{display:none}

/* ===== PC shell (작업용) ===== */
@media (min-width:1024px){
  body.pc header.top{display:none}
  body.pc #app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  body.pc nav.tabs{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;border:0;border-right:1px solid var(--line);background:#fff;padding:20px 14px;gap:2px}
  body.pc nav.tabs .brand{padding:4px 10px 18px}
  body.pc nav.tabs .brand b{display:block;font-size:16px;letter-spacing:-.3px}
  body.pc nav.tabs .brand small{color:var(--mute);font-size:12px}
  body.pc nav.tabs button[data-t]{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;color:var(--sub)}
  body.pc nav.tabs button[data-t] svg{width:18px;height:18px}
  body.pc nav.tabs button[data-t].on{background:var(--blue-soft);color:var(--navy)}
  body.pc nav.tabs .side-only{display:block}
  body.pc main{max-width:none;margin:0;padding:22px 28px 60px}
  body.pc .pc-hide{display:none!important}
}
.sidebox{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--sub)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:#f6f7fa;cursor:pointer;font-weight:600;color:var(--ink)}
.switch i{width:34px;height:20px;border-radius:99px;background:#cfd5e0;position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on i{background:var(--blue)} .switch.on i:after{left:16px}
.savebox{margin-top:10px;padding:10px;border-radius:10px;background:#fff8ec;border:1px solid #fde2b5}
.savebox b{color:var(--warn)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c9d1de}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}

/* ===== common ===== */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{margin:0;font-size:22px;letter-spacing:-.4px}
.pagehead p{margin:4px 0 0;color:var(--sub);font-size:13px}
h2.sec{font-size:15px;margin:22px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec small{font-weight:500;color:var(--mute);font-size:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff;outline:none;margin-top:10px}
.search:focus{border-color:var(--blue)}
body.pc .toolbar .search{width:260px;margin:0;padding:8px 12px;font-size:14px;border-radius:9px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1024px){body.pc .kpis.k5{grid-template-columns:2fr 1fr 1fr 1fr 1fr}body.pc .kpis.k5 .hero{grid-column:auto}}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:3px}
.kpi.hero{grid-column:1/-1;background:var(--navy);color:#fff}
.kpi.hero .l,.kpi.hero .s{color:rgba(255,255,255,.7)}
.kpi.hero .v small{color:rgba(255,255,255,.8)}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#7aa2ff;border-radius:99px}
.grid2{display:grid;gap:14px}
@media (min-width:1024px){body.pc .grid2{grid-template-columns:1.3fr 1fr}}

.mchart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:150px;padding-top:8px}
.mchart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.mchart .stack{width:70%;max-width:30px;position:relative;display:flex;align-items:flex-end;height:120px}
.mchart .tg{position:absolute;left:0;right:0;bottom:0;border:1.5px dashed #b8c3d9;border-bottom:0;border-radius:4px 4px 0 0}
.mchart .am{position:relative;width:100%;background:var(--blue);border-radius:4px 4px 0 0}
.mchart .am.over{background:var(--good)}
.mchart .lb{font-size:10.5px;color:var(--mute);margin-top:4px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:600;color:var(--sub);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;background:#fafbfc;position:sticky;top:0}
.tbl td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f6f8fd}
.tbl tr.mrow td{background:#f4f6fa;font-weight:700;font-size:12.5px;color:var(--sub)}
.tbl tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 170px)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-weight:700;font-size:14px}
.mhead span{font-weight:500;font-size:12px;color:var(--sub)}
.list{display:grid;gap:8px}
@media (min-width:700px){.list{grid-template-columns:1fr 1fr}}
.ev{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;border:1px solid transparent}
.ev:active{border-color:var(--blue)}
.ev .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev .nm{font-weight:700;font-size:14.5px;line-height:1.35;letter-spacing:-.2px}
.ev .meta{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.45}
.ev .nums{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.ev .nums b{color:var(--ink);font-size:13.5px;margin-left:3px}
.rate{font-weight:800;font-size:15px;white-space:nowrap}
.tbl .rate{font-size:13px}
.rate.g{color:var(--good)} .rate.w{color:var(--warn)} .rate.b{color:var(--bad)} .rate.n{color:var(--mute);font-weight:600;font-size:12px}
.pbar{height:5px;background:#eef1f6;border-radius:99px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:4px;vertical-align:1px;white-space:nowrap}
.t-blue{background:var(--blue-soft);color:var(--blue)} .t-green{background:var(--good-soft);color:var(--good)}
.t-warn{background:var(--warn-soft);color:var(--warn)} .t-red{background:var(--bad-soft);color:var(--bad)}
.t-gray{background:#eef0f4;color:var(--sub)} .t-navy{background:var(--navy);color:#fff}

/* ===== sheet / drawer ===== */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.on{display:block}
#sheet .dim{position:absolute;inset:0;background:rgba(10,15,30,.45)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){#sheet .pane{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:560px;border-radius:20px;max-height:84vh}}
@media (min-width:1024px){body.pc #sheet .dim{background:rgba(10,15,30,.25)}body.pc #sheet .pane{left:auto;right:0;top:0;bottom:0;transform:none;width:min(640px,48vw);max-height:none;height:100vh;border-radius:0;padding:18px 24px 24px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}body.pc #sheet .grab{display:none}}
#sheet .grab{width:40px;height:4px;border-radius:9px;background:#d5dae3;margin:4px auto 12px}
#sheet h3{margin:0 0 4px;font-size:18px;line-height:1.35;padding-right:40px}
#sheet .x{position:sticky;top:0;float:right;border:0;background:#f1f3f7;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;z-index:2}
.kv{display:grid;grid-template-columns:110px 1fr;font-size:14px;margin-top:12px;border-top:1px solid var(--line)}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line2)}
.kv>div:nth-child(odd){color:var(--sub);font-size:13px}
.note{background:#f7f8fb;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-top:12px;line-height:1.5;white-space:pre-wrap}
.stores{display:flex;flex-wrap:wrap;gap:5px}
.stores span{font-size:12px;background:#f1f4fa;border-radius:6px;padding:3px 8px}
.stores span.d{background:#fff3e6;color:#a35a00}

/* form */
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px;margin-top:14px}
.form .f{grid-column:span 2;display:flex;flex-direction:column;gap:4px}
.form .f.w3{grid-column:span 3} .form .f.w6{grid-column:1/-1} .form .f.w1{grid-column:span 1}
.form label{font-size:12px;color:var(--sub);font-weight:600}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;outline:none;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue)}
.form textarea{min-height:70px;resize:vertical}
.form .grp{grid-column:1/-1;font-size:13px;font-weight:700;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.form .hint{font-size:11px;color:var(--mute)}
.formbar{position:sticky;bottom:-24px;background:#fff;display:flex;gap:8px;justify-content:space-between;padding:14px 0 4px;margin-top:16px;border-top:1px solid var(--line)}

/* apt */
.apt{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.apt .mo{flex:0 0 44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1}
.apt .mo small{font-size:10px;font-weight:600;margin-top:2px}
.apt .bd{flex:1;min-width:0}
.apt .nm{font-weight:700;font-size:14.5px;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apt .meta{font-size:12px;color:var(--sub);margin-top:2px}
.apt .rt{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.apt .rt b{display:block;font-size:14px;color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (min-width:700px){.mgrid{grid-template-columns:repeat(12,1fr)}}
.mcell{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:8px 4px;text-align:center;cursor:pointer;border:1.5px solid transparent}
.mcell.on{border-color:var(--navy)}
.mcell .m{font-size:11px;color:var(--sub)}
.mcell .c{font-size:17px;font-weight:800;margin-top:2px}
.mcell .h{font-size:10.5px;color:var(--mute)}
.mcell.zero{opacity:.45}
.empty{text-align:center;color:var(--mute);padding:28px 0;font-size:14px}
.foot{font-size:11.5px;color:var(--mute);margin-top:22px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:70;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="lock">
  <form class="box" id="lockForm" autocomplete="on">
    <h1>입주박람회 관리</h1>
    <p>충청영업팀 · 비밀번호를 입력하세요</p>
    <input type="text" name="username" value="chungcheong" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required>
    <label class="row"><input type="checkbox" id="keep" checked> 이 기기에서 로그인 유지</label>
    <button class="go" type="submit">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top"><div class="t">
    <div><h1>충청 입주박람회 관리</h1><small id="upd"></small></div>
    <button class="ghost" id="logout">잠금</button>
  </div></header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="sheet"><div class="dim"></div><div class="pane" id="pane"></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => n == null || n === '' || isNaN(n) ? '–' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits: d, minimumFractionDigits: d});
const pct = (a, b) => (a != null && b) ? a / b * 100 : null;
const KEY = 'ipju_fair_pw', TKEY = 'ipju_fair_gh';
const TODAY = new Date();
const isPC = () => window.matchMedia('(min-width:1024px)').matches && window.matchMedia('(pointer:fine)').matches;
let DB = null, PW = null, SHA = null;
const S = { tab: 'home', year: 2026, q: '', aptYear: null, aptMonth: 0, aptSido: '전체', aptQ: '', aptSt: '전체', edit: false, dirty: new Set() };
const APT_ST = ['미착수', '협의중', '박람회확정', '진행완료', '보류'];
const ST_CLS = {'미착수': 't-gray', '협의중': 't-warn', '박람회확정': 't-blue', '진행완료': 't-green', '보류': 't-red'};
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- crypto ---------- */
const ub64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = (u8) => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
async function kdf(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function decrypt(pw) {
  const box = await (await fetch('data.enc.json?t=' + Date.now(), {cache: 'no-store'})).json();
  const key = await kdf(pw, ub64(box.salt), box.iter);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub64(box.iv)}, key, ub64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encrypt(obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const key = await kdf(PW, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({v: 1, iter, salt: b64(salt), iv: b64(iv), ct: b64(ct)});
}
async function unlock(pw, keep) {
  DB = await decrypt(pw); PW = pw;
  if (keep) ls(KEY, pw);
  prep(); $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden'); render();
}
$('#lockForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#err').textContent = '확인 중…';
  try { await unlock($('#pw').value, $('#keep').checked); $('#err').textContent = ''; }
  catch (x) { $('#err').textContent = '비밀번호가 맞지 않습니다'; }
});

  const mg = a.mg || {};
  const kv = [['입주', `${a.y}년 ${a.m}월`], ['지역', `${esc(a.sido)} ${esc(a.sigungu)} ${esc(a.dong)}`], ['유형', esc(a.type)], ['세대수', fmt(a.hh) + '세대'], ['권장 박람회', `${rm} ~ 입주 1개월 전`]];
  const mk = [['상태', `<span class="tag ${ST_CLS[a._st]}">${a._st}</span>`], ['박람회 일정', esc(mg.fairDate) || '–'], ['주관사 / 장소', [mg.host, mg.venue].filter(Boolean).map(esc).join(' · ') || '–'], ['고객초청행사', esc(mg.invite) || '–'], ['배정점', esc(mg.stores) || '–'], ['공략현황', esc(mg.attack) || '–']];
  openSheet(`<h3>${esc(a.name)}</h3><div><span class="tag t-blue">${a.y % 100}년 ${a.m}월 입주</span>${a.flag ? '<span class="tag t-warn">시트 주황 표시</span>' : ''}</div>
    <div class="kv">${kv.map(([k, v]) => `<div>${k}</div><div class="num">${v}</div>`).join('')}</div>
    <h2 class="sec">관리 현황</h2><div class="kv" style="margin-top:0">${mk.map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join('')}</div>
    ${mg.memo ? `<div class="note">${esc(mg.memo)}</div>` : ''}
    <h2 class="sec">박람회 이력 · 일정 <small>${a._ev.length}건</small></h2>
    <div class="list" style="grid-template-columns:1fr">${a._ev.map(evCard).join('') || '<div class="empty" style="padding:14px 0">연결된 박람회가 없습니다</div>'}</div>`);
}
function editApt(a, isNew) {
  const mg = a.mg || {};
  openSheet(`<h3>${isNew ? '입주단지 추가' : '입주단지 관리'}</h3><div style="color:var(--sub);font-size:13px">${isNew ? '' : esc(a.name) + ' · ' + a.y + '년 ' + a.m + '월 입주 · 권장 박람회 ' + a._recLabel}</div>
  <form class="form" id="af">
    <div class="grp" style="border:0;margin:0;padding:0">단지 정보</div>
    ${F('name', 'MIS 입력 아파트명', a.name, {w: 6})}
    ${F('y', '입주년', a.y, {w: 1, num: 1})}${F('m', '입주월', a.m, {w: 1, num: 1})}${F('sido', '시도', a.sido, {sel: ['대전광역시', '세종특별자치시', '충청북도', '충청남도']})}${F('type', '유형', a.type, {w: 1, sel: ['분양', '임대', '조합']})}${F('hh', '세대수', a.hh, {w: 1, num: 1})}
    ${F('sigungu', '시군구', a.sigungu, {w: 3})}${F('dong', '동', a.dong, {w: 3})}
    <div class="grp">관리 현황</div>
    ${F('status', '상태', mg.status || '', {sel: [['', `자동 (${a._st || '미착수'})`], ...APT_ST]})}${F('fairDate', '박람회 일정', mg.fairDate, {ph: '27.02.13~14'})}${F('host', '주관사', mg.host)}
    ${F('venue', '장소', mg.venue, {w: 3})}${F('invite', '고객초청행사', mg.invite, {w: 3, ph: '장소 · 일정 · 초청고객수'})}
    ${F('stores', '배정점', mg.stores, {w: 6, ph: '예: 당사, 청주, 율량, 서청주 / 현대충청'})}
    ${F('attack', '공략현황 (계약 게시판 · 계약 주소)', mg.attack, {w: 6})}
    ${F('memo', '메모', mg.memo, {w: 6, area: 1})}
  </form>
  <div class="formbar">${isNew ? '<span></span>' : '<button class="btn danger" id="delApt">삭제</button>'}<div style="display:flex;gap:8px"><button class="btn" id="cancel">취소</button><button class="btn pri" id="apply">적용</button></div></div>
  ${!isNew && a._ev.length ? `<h2 class="sec">연결된 박람회 <small>클릭하면 박람회 수정</small></h2><div class="list" style="grid-template-columns:1fr">${a._ev.map(evCard).join('')}</div>` : ''}`);
  $('#cancel').onclick = closeSheet;
  if (!isNew) $('#delApt').onclick = () => { if (!confirm('이 단지를 삭제할까요?')) return; DB.apts = DB.apts.filter(x => x !== a); S.dirty.add(a.id); afterEdit('삭제했습니다'); };
  $('#apply').onclick = () => {
    const fd = Object.fromEntries(new FormData($('#af')));
    if (!fd.name.trim()) return toast('아파트명을 입력하세요');
    Object.assign(a, { name: fd.name.trim(), y: numOrNull(fd.y) || a.y, m: numOrNull(fd.m) || a.m, sido: fd.sido, type: fd.type, hh: numOrNull(fd.hh) || 0, sigungu: fd.sigungu.trim(), dong: fd.dong.trim() });
    const m = {}; for (const k of ['status', 'fairDate', 'host', 'venue', 'invite', 'stores', 'attack', 'memo']) if (fd[k] && fd[k].trim()) m[k] = fd[k].trim();
    a.mg = m;
    if (isNew) DB.apts.push(a);
    S.dirty.add(a.id); afterEdit(isNew ? '추가했습니다' : '적용했습니다');
  };
}
function afterEdit(msg) { closeSheet(); prep(); render(); toast(msg + ' · 왼쪽에서 저장하세요'); }

/* ---------- 저장 ---------- */
function cleanDB() {
  const strip = (o) => Object.fromEntries(Object.entries(o).filter(([k]) => !k.startsWith('_')));
  const d = new Date(); const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return { ...DB, meta: { ...DB.meta, updated: ymd }, events: DB.events.map(strip), apts: DB.apts.map(strip) };
}
function repoInfo() {
  const saved = JSON.parse(ls(TKEY) || '{}');
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const guess = m ? { owner: m[1], repo: location.pathname.split('/').filter(Boolean)[0] || (m[1] + '.github.io') } : {};
  return { owner: saved.owner || guess.owner || '', repo: saved.repo || guess.repo || '', token: saved.token || '' };
}
function ghSettings() {
  const r = repoInfo();
  openSheet(`<h3>저장 설정 (이 PC에만 저장)</h3>
  <div class="note" style="margin-top:8px">편집한 내용을 GitHub에 바로 저장하려면 이 저장소에만 쓰기 권한이 있는 토큰이 필요합니다.<br>GitHub → Settings → Developer settings → Fine-grained tokens → 저장소 1개 선택 → Contents: Read and write.<br>토큰은 이 PC 브라우저에만 저장되고 데이터 파일에는 들어가지 않습니다.</div>
  <form class="form" id="gf">${F('owner', 'GitHub 계정', r.owner, {w: 3})}${F('repo', '저장소', r.repo, {w: 3})}${F('token', '토큰', r.token, {w: 6, ph: 'github_pat_...'})}</form>
  <div class="formbar"><button class="btn danger" id="gClear">토큰 지우기</button><div style="display:flex;gap:8px"><button class="btn" id="cancel">닫기</button><button class="btn pri" id="gSave">저장</button></div></div>`);
  $('#cancel').onclick = closeSheet;
  $('#gClear').onclick = () => { ls(TKEY, null); closeSheet(); toast('토큰을 지웠습니다'); };
  $('#gSave').onclick = () => { const fd = Object.fromEntries(new FormData($('#gf'))); ls(TKEY, JSON.stringify({ owner: fd.owner.trim(), repo: fd.repo.trim(), token: fd.token.trim() })); closeSheet(); toast('저장 설정을 기억했습니다'); render(); };
}
async function saveGitHub() {
  const r = repoInfo();
  if (!r.token || !r.owner || !r.repo) return ghSettings();
  const btn = $('#saveGh'); if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
  try {
    const api = `https://api.github.com/repos/${r.owner}/${r.repo}/contents/data.enc.json`;
    const H = { Authorization: `Bearer ${r.token}`, Accept: 'application/vnd.github+json' };
    const cur = await fetch(api + '?ref=main&t=' + Date.now(), { headers: H, cache: 'no-store' });
    if (!cur.ok) throw new Error('파일 조회 실패 (' + cur.status + ')');
    const sha = (await cur.json()).sha;
    const content = await encrypt(cleanDB());
    const res = await fetch(api, { method: 'PUT', headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `데이터 수정 (${S.dirty.size}건)`, content: btoa(unescape(encodeURIComponent(content))), sha, branch: 'main' }) });
    if (!res.ok) throw new Error('저장 실패 (' + res.status + ')');
    DB.meta.updated = cleanDB().meta.updated; S.dirty.clear(); prep(); render();
    toast('GitHub에 저장했습니다 · 1~2분 뒤 모든 기기에 반영');
  } catch (err) { toast(err.message + ' · 설정을 확인하세요'); if (btn) { btn.disabled = false; btn.textContent = 'GitHub에 저장'; } }
}
async function saveFile() {
  const content = await encrypt(cleanDB());
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type: 'application/json' })); a.download = 'data.enc.json'; a.click();
  toast('data.enc.json 을 저장소에 덮어 올리면 반영됩니다');
}
})();
</script>
