<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ece6da">
<title>충청 입주박람회 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Blog J 화면 디자인 3.0 "입체 교정지" — 판 · 돋움 · 들어감 · 눌림 */
:root{
  --plate:#ece6da; --raise:#f1ebe1; --raise2:#f4efe6; --sink:#e7e0d2; --sink2:#e2dacb; --press:#e6dfd1; --paper:#fffdf9;
  --sh-raise:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
  --sh-raise2:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
  --sh-pop:14px 18px 40px rgba(120,100,70,.38),-8px -8px 22px rgba(255,255,255,.7);
  --sh-sink:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
  --sh-press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
  --sh-paper:0 1px 2px rgba(90,75,50,.12),0 6px 18px rgba(120,100,70,.16);
  --ink:#1f2125; --sub:#5b5547; --mute:#6f6857; --line:#d9d0bf; --line2:#e7e0d2; --crop:#8d8574;
  --navy:#20263a; --amber:#e08a3e; --amber-h:#d47c2e; --red:#c23a2b; --teal:#1f7f8f; --fin:#4f56d8; --brown:#8a5a1c;
  /* 기존 이름 유지 */
  --bg:var(--plate); --card:var(--raise); --blue:var(--navy); --good:var(--navy); --warn:var(--brown); --bad:var(--red);
  --r:16px; --mono:"JetBrains Mono","Pretendard Variable",Pretendard,"Malgun Gothic",monospace;
  --head:"SUIT Variable",SUIT,"Pretendard Variable",Pretendard,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plate);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);letter-spacing:0}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
input[type=checkbox]{accent-color:var(--navy);width:18px;height:18px}

/* ===== 잠금 ===== */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--plate);padding:24px;z-index:60}
#lock .box{width:100%;max-width:380px;background:var(--raise);border-radius:18px;padding:30px 28px;box-shadow:var(--sh-raise)}
#lock .badge{width:56px;height:56px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;position:relative;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.25),var(--sh-raise2)}
#lock .badge svg{width:26px;height:26px}
#lock .badge:after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid var(--raise)}
#lock .kick{font-size:12.5px;font-weight:700;color:var(--mute)}
#lock h1{margin:4px 0 6px;font:800 26px/1.25 var(--head);letter-spacing:-.035em}
#lock p{margin:0 0 22px;color:var(--sub);font-size:15px}
#lock input[type=password]{width:100%;height:48px;padding:0 16px;border:2px solid transparent;border-radius:12px;font-size:16px;outline:none;background:var(--sink);box-shadow:var(--sh-sink)}
#lock input[type=password]:focus{border-color:var(--navy)}
#lock .row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--sub)}
#lock .go{width:100%;height:52px;border:0;border-radius:12px;background:var(--amber);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--sh-raise2)}
#lock .go:active{box-shadow:var(--sh-press);background:var(--amber-h)}
#lock .err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* ===== 모바일 틀 ===== */
header.top{position:sticky;top:0;z-index:10;background:var(--plate);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;box-shadow:0 6px 14px rgba(160,140,108,.25)}
header.top .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
.mbadge{flex:0 0 38px;height:38px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.25)}
.mbadge svg{width:19px;height:19px}
.mbadge:after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--amber);border:2px solid var(--plate)}
header.top h1{font:800 18px/1.2 var(--head);margin:0;letter-spacing:-.03em;white-space:nowrap}
header.top small{color:var(--mute);font-size:12.5px;font-family:var(--mono);letter-spacing:0}
.ghost{background:var(--raise2);border:0;border-radius:10px;height:36px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--sh-raise2)}
.ghost:active{box-shadow:var(--sh-press);background:var(--press)}
main{max-width:1080px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:10;background:var(--raise);border-radius:16px;display:flex;padding:6px;gap:4px;box-shadow:var(--sh-pop)}
nav.tabs button[data-t]{flex:1;border:2px solid transparent;background:none;border-radius:12px;padding:6px 2px 5px;font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button[data-t] svg{width:21px;height:21px}
nav.tabs button[data-t].on{color:var(--ink);font-weight:700;background:var(--press);box-shadow:var(--sh-press);border-color:var(--navy)}
nav.tabs button[data-t].on:after{content:"";position:absolute;right:7px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.side-only{display:none}

/* ===== PC 틀 (작업용) ===== */
@media (min-width:1024px){
  body.pc header.top{display:none}
  body.pc #app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  body.pc nav.tabs{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;flex-direction:column;justify-content:flex-start;border-radius:0;background:var(--raise);padding:22px 16px;gap:6px;box-shadow:6px 0 18px rgba(160,140,108,.28)}
  body.pc nav.tabs .brand{display:flex;gap:12px;align-items:center;padding:0 4px 20px}
  body.pc nav.tabs .brand b{display:block;font:800 17px/1.25 var(--head);letter-spacing:-.03em}
  body.pc nav.tabs .brand small{color:var(--mute);font-size:12.5px;font-family:var(--mono);letter-spacing:0}
  body.pc nav.tabs button[data-t]{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;height:46px;padding:0 14px;color:var(--ink);background:var(--raise2);box-shadow:var(--sh-raise2)}
  body.pc nav.tabs button[data-t]:hover{border-color:var(--navy)}
  body.pc nav.tabs button[data-t] svg{width:19px;height:19px}
  body.pc nav.tabs button[data-t].on{background:var(--press);box-shadow:var(--sh-press);border-color:var(--navy)}
  body.pc nav.tabs button[data-t].on:after{right:12px;top:50%;margin-top:-3px}
  body.pc nav.tabs .side-only{display:block}
  body.pc nav.tabs .brand.side-only{display:flex}
  body.pc main{max-width:none;margin:0;padding:28px 32px 60px}
}
.sidebox{margin-top:auto;padding-top:16px;font-size:13px;color:var(--sub)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;padding:0 14px;border-radius:12px;background:var(--raise2);box-shadow:var(--sh-raise2);cursor:pointer;font-weight:700;color:var(--ink);font-size:14px}
.switch i{width:52px;height:28px;border-radius:99px;background:var(--sink);box-shadow:var(--sh-sink);position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--raise2);box-shadow:1px 2px 4px rgba(120,100,70,.4);transition:.15s}
.switch.on i{background:var(--navy);box-shadow:inset 2px 2px 5px rgba(0,0,0,.45)} .switch.on i:after{left:28px;background:#fff}
.savebox{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--sink);box-shadow:var(--sh-sink)}
.savebox b{color:var(--red);font-size:13px}
.btn{border:2px solid transparent;background:var(--raise2);border-radius:12px;height:40px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:var(--sh-raise2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--navy);transform:translateY(1px)}
.btn:active{box-shadow:var(--sh-press);background:var(--press)}
.btn.pri,.btn.blue{background:var(--amber);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--sh-raise2)}
.btn.pri:hover,.btn.blue:hover{border-color:transparent;background:var(--amber-h)}
.btn.navy{background:var(--navy);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{height:36px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}

/* ===== 공통 ===== */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h2{margin:0;font:800 28px/1.2 var(--head);letter-spacing:-.035em}
.pagehead p{margin:6px 0 0;color:var(--sub);font-size:14px}
h2.sec{font:700 16px/1.3 var(--head);letter-spacing:-.02em;margin:28px 2px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec small{font:400 12.5px var(--mono);letter-spacing:0;color:var(--mute)}
h2.sec small a{color:var(--navy)!important;font-family:"Pretendard Variable",Pretendard,sans-serif;font-weight:700;text-decoration:underline!important;text-underline-offset:3px}
.card{background:var(--raise);border-radius:var(--r);box-shadow:var(--sh-raise);padding:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 10px;margin:-6px -4px -10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid transparent;background:var(--raise2);border-radius:12px;height:40px;padding:0 14px;font-size:14px;cursor:pointer;color:var(--ink);box-shadow:var(--sh-raise2);position:relative}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--press);box-shadow:var(--sh-press);border-color:var(--navy);font-weight:700;padding-right:22px}
.chip.on:after{content:"";position:absolute;right:8px;top:50%;margin-top:-3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{width:100%;height:48px;padding:0 16px;border:2px solid transparent;border-radius:12px;font-size:15.5px;background:var(--sink);box-shadow:var(--sh-sink);outline:none;margin-top:14px}
.search:focus{border-color:var(--navy)}
body.pc .toolbar .search{width:280px;margin:0;height:44px}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1024px){body.pc .kpis.k5{grid-template-columns:2fr 1fr 1fr 1fr 1fr}body.pc .kpis.k5 .hero{grid-column:auto}}
.kpi{background:var(--raise);border-radius:var(--r);box-shadow:var(--sh-raise);padding:16px}
.kpi .l{font-size:14px;font-weight:700;color:var(--sub)}
.kpi .v{font:800 24px/1.2 var(--head);margin-top:6px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .v small{font:600 13px "Pretendard Variable",Pretendard,sans-serif;color:var(--sub);margin-left:3px;letter-spacing:0}
.kpi .s{font:400 12.5px/1.5 var(--mono);letter-spacing:0;color:var(--mute);margin-top:4px}
.kpi.hero{grid-column:1/-1}
.kpi.hero .v{font-size:30px}
.kpi.hero .v .rt{font-size:16px;margin-left:10px;color:var(--navy);font-weight:800}
.bar{height:14px;background:var(--sink);border-radius:99px;overflow:hidden;margin-top:12px;box-shadow:var(--sh-sink);padding:3px}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){body.pc .grid2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}

.mchart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:160px;padding:12px 8px 8px;background:var(--sink);border-radius:12px;box-shadow:var(--sh-sink)}
.mchart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.mchart .stack{width:70%;max-width:28px;position:relative;display:flex;align-items:flex-end;height:120px}
.mchart .tg{position:absolute;left:0;right:0;bottom:0;border:1.5px dashed var(--crop);border-bottom:0;border-radius:4px 4px 0 0}
.mchart .am{position:relative;width:100%;background:#7c7a8a;border-radius:4px 4px 0 0}
.mchart .am.over{background:var(--navy)}
.mchart .lb{font:400 12.5px var(--mono);color:var(--mute);margin-top:4px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* 표 — 머리 줄 들어감색 + 먹선 */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:700;color:var(--ink);text-align:right;padding:10px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap;font-size:12.5px;background:var(--sink);position:sticky;top:0;z-index:1}
.tbl td{text-align:right;padding:10px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--paper)}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7f1e6}
.tbl tr.mrow td{background:#f3eee5;font-weight:700;font-size:13px;color:var(--ink);border-bottom:1.5px solid var(--line)}
.tbl tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{background:var(--paper);border-radius:6px;box-shadow:var(--sh-paper);overflow:auto;max-height:calc(100vh - 210px);position:relative}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.card.scrollx{background:var(--paper);border-radius:6px;box-shadow:var(--sh-paper);padding:0!important}

.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 2px 10px;font:700 16px var(--head);letter-spacing:-.02em;border-bottom:2px solid var(--ink);padding-bottom:8px}
.mhead span{font:400 12.5px var(--mono);letter-spacing:0;color:var(--mute);text-align:right}
.list{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.list>*{min-width:0}
@media (min-width:700px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ev{background:var(--raise2);border-radius:var(--r);box-shadow:var(--sh-raise2);padding:14px 16px;cursor:pointer;border:2px solid transparent}
.ev:hover{border-color:var(--navy)}
.ev:active{box-shadow:var(--sh-press);background:var(--press)}
.ev .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ev .nm{font-weight:700;font-size:15.5px;line-height:1.4;letter-spacing:-.02em}
.ev .meta{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.ev .nums{display:flex;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--mute);flex-wrap:wrap;font-family:var(--mono);letter-spacing:0}
.ev .nums b{color:var(--ink);font:700 14px "Pretendard Variable",Pretendard,sans-serif;margin-left:4px;font-variant-numeric:tabular-nums}
.rate{font:800 16px var(--head);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tbl .rate{font-size:14px}
.rate.g{color:var(--navy)} .rate.w{color:var(--brown)} .rate.b{color:var(--red)} .rate.n{color:var(--mute);font-weight:600;font-size:12.5px}
.pbar{height:12px;background:var(--sink);border-radius:99px;margin-top:10px;overflow:hidden;box-shadow:var(--sh-sink);padding:3px}
.pbar i{display:block;height:100%;border-radius:99px}
/* 꼬리표: 알약 대신 들어간 네모 */
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:5px;vertical-align:1px;white-space:nowrap;background:var(--sink);box-shadow:inset 1px 1px 3px rgba(160,140,108,.45),inset -1px -1px 2px rgba(255,255,255,.8);color:var(--sub);line-height:1.5}
.t-blue{color:var(--navy)} .t-green{color:var(--teal)} .t-warn{color:var(--brown)} .t-red{color:var(--red)} .t-gray{color:var(--sub)}
.t-navy{background:var(--navy);color:#fff;box-shadow:none}

/* ===== 상세 — 교정지 ===== */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.on{display:block}
#sheet .dim{position:absolute;inset:0;background:rgba(60,50,35,.35)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--plate);border-radius:18px 18px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--sh-pop)}
@media (min-width:700px){#sheet .pane{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:600px;border-radius:18px;max-height:86vh;padding:20px}}
@media (min-width:1024px){body.pc #sheet .pane{left:auto;right:0;top:0;bottom:0;transform:none;width:min(680px,50vw);max-height:none;height:100vh;border-radius:0;padding:20px 24px 28px}body.pc #sheet .grab{display:none}}
#sheet .grab{width:44px;height:6px;border-radius:9px;background:var(--sink);box-shadow:var(--sh-sink);margin:2px auto 12px}
.paper{position:relative;margin:8px 8px 0;background:var(--paper);border-radius:6px;box-shadow:var(--sh-paper);padding:22px 20px 20px}
.paper:before,.paper:after{content:"";position:absolute;width:14px;height:14px;border:0 solid var(--crop)}
.paper:before{left:-8px;top:-8px;border-left-width:1.5px;border-top-width:1.5px}
.paper:after{right:-8px;bottom:-8px;border-right-width:1.5px;border-bottom-width:1.5px}
.paper .plate-info{font:400 12.5px var(--mono);color:var(--mute);margin-bottom:6px}
#sheet h3{margin:0 0 8px;font:800 22px/1.35 var(--head);letter-spacing:-.03em;padding-right:44px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
#sheet .x{position:absolute;top:14px;right:14px;border:2px solid transparent;background:var(--raise2);border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:16px;z-index:2;box-shadow:var(--sh-raise2)}
#sheet .x:hover{border-color:var(--navy)}
#sheet .pane .list{grid-template-columns:minmax(0,1fr)}
.kv{display:grid;grid-template-columns:116px 1fr;font-size:15px;margin-top:12px}
.kv>div{padding:10px 0;border-bottom:1px solid var(--line2)}
.kv>div:nth-child(odd){color:var(--sub);font-size:14px;font-weight:700}
.note{background:var(--sink);box-shadow:var(--sh-sink);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--sub);margin-top:14px;line-height:1.55;white-space:pre-wrap}
.stores{display:flex;flex-wrap:wrap;gap:6px}
.stores span{font-size:13px;background:var(--sink);box-shadow:inset 1px 1px 3px rgba(160,140,108,.45),inset -1px -1px 2px rgba(255,255,255,.8);border-radius:6px;padding:3px 9px}
.stores span.d{color:var(--brown);font-weight:700}

/* 입력 폼 — 들어간 칸 */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 12px;margin-top:16px}
.form .f{grid-column:span 2;display:flex;flex-direction:column;gap:6px;min-width:0}
.form .f.w3{grid-column:span 3} .form .f.w6{grid-column:1/-1} .form .f.w1{grid-column:span 1}
.form label{font-size:13px;color:var(--sub);font-weight:700}
.form input,.form select,.form textarea{border:2px solid transparent;border-radius:12px;height:44px;padding:0 12px;font-size:15px;background:var(--sink);box-shadow:var(--sh-sink);outline:none;width:100%}
.form textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--navy)}
.form .grp{grid-column:1/-1;font:700 14px var(--head);margin-top:12px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.form .hint{font-size:12.5px;color:var(--mute)}
.formbar{position:sticky;bottom:-28px;background:var(--plate);display:flex;gap:10px;justify-content:space-between;padding:16px 0 6px;margin-top:18px}

/* 입주단지 */
.apt{background:var(--raise2);border-radius:var(--r);box-shadow:var(--sh-raise2);padding:14px 16px;cursor:pointer;display:flex;gap:14px;align-items:center;border:2px solid transparent}
.apt:hover{border-color:var(--navy)}
.apt:active{box-shadow:var(--sh-press);background:var(--press)}
.apt .mo{flex:0 0 48px;height:48px;border-radius:12px;background:var(--sink);box-shadow:var(--sh-sink);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 18px/1 var(--head)}
.apt .mo small{font:400 12.5px var(--mono);color:var(--mute);margin-top:3px}
.apt .bd{flex:1;min-width:0}
.apt .nm{font-weight:700;font-size:15.5px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apt .meta{font-size:13px;color:var(--sub);margin-top:3px}
.apt .rt{text-align:right;font:400 12.5px var(--mono);color:var(--mute);white-space:nowrap}
.apt .rt b{display:block;font:800 16px var(--head);color:var(--ink);font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (min-width:700px){.mgrid{grid-template-columns:repeat(12,minmax(0,1fr))}}
.mcell{background:var(--raise2);border-radius:12px;box-shadow:var(--sh-raise2);padding:8px 2px;text-align:center;cursor:pointer;border:2px solid transparent;position:relative}
.mcell:hover{border-color:var(--navy)}
.mcell.on{border-color:var(--navy);background:var(--press);box-shadow:var(--sh-press)}
.mcell.on:after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.mcell .m{font:400 12.5px var(--mono);color:var(--mute)}
.mcell .c{font:800 19px var(--head);margin-top:2px}
.mcell .h{font:400 12.5px var(--mono);color:var(--mute);letter-spacing:-.02em}
.mcell.zero{background:var(--sink);box-shadow:var(--sh-sink);cursor:default}
.mcell.zero .c{color:var(--mute)}
.empty{text-align:center;color:var(--sub);padding:28px 0;font-size:14px;background:var(--sink);box-shadow:var(--sh-sink);border-radius:12px}
.tbl .empty{background:none;box-shadow:none}
.foot{font-size:12.5px;color:var(--mute);margin-top:26px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--raise);color:var(--ink);font-weight:700;padding:12px 18px;border-radius:12px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--sh-pop);border:2px solid var(--navy)}
#toast.on{opacity:1}
@media (min-width:1024px){body.pc #toast{bottom:28px}}
</style>
</head>
<body>

<div id="lock">
  <form class="box" id="lockForm" autocomplete="on">
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 21h8V9l-8-3"/><path d="M8 8h.01M8 12h.01M8 16h.01M16 12h.01M16 16h.01"/></svg></div>
    <div class="kick">충청영업팀 · 입주박람회</div>
    <h1>입주박람회 관리</h1>
    <p>비밀번호를 입력하세요</p>
    <input type="text" name="username" value="chungcheong" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required>
    <label class="row"><input type="checkbox" id="keep" checked> 이 기기에서 로그인 유지</label>
    <button class="go" type="submit">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top"><div class="t">
    <div class="brandrow"><span class="mbadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 21h8V9l-8-3"/><path d="M8 8h.01M8 12h.01M8 16h.01M16 12h.01M16 16h.01"/></svg></span><div><h1>충청 입주박람회</h1><small id="upd"></small></div></div>
    <button class="ghost" id="logout">잠금</button>
  </div></header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="sheet"><div class="dim"></div><div class="pane" id="pane"></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => n == null || n === '' || isNaN(n) ? '–' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits: d, minimumFractionDigits: d});
const pct = (a, b) => (a != null && b) ? a / b * 100 : null;
const KEY = 'ipju_fair_pw', TKEY = 'ipju_fair_gh';
const TODAY = new Date();
const isPC = () => window.matchMedia('(min-width:1024px)').matches && window.matchMedia('(pointer:fine)').matches;
let DB = null, PW = null, SHA = null;
const S = { tab: 'home', year: 2026, q: '', aptYear: null, aptMonth: 0, aptSido: '전체', aptQ: '', aptSt: '전체', edit: false, dirty: new Set() };
const APT_ST = ['미착수', '협의중', '박람회확정', '진행완료', '보류'];
const ST_CLS = {'미착수': 't-gray', '협의중': 't-warn', '박람회확정': 't-blue', '진행완료': 't-green', '보류': 't-red'};
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- crypto ---------- */
const ub64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = (u8) => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
async function kdf(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function decrypt(pw) {
  const box = await (await fetch('data.enc.json?t=' + Date.now(), {cache: 'no-store'})).json();
  const key = await kdf(pw, ub64(box.salt), box.iter);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub64(box.iv)}, key, ub64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encrypt(obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const key = await kdf(PW, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({v: 1, iter, salt: b64(salt), iv: b64(iv), ct: b64(ct)});
}
async function unlock(pw, keep) {
  DB = await decrypt(pw); PW = pw;
  if (keep) ls(KEY, pw);
  prep(); $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden'); render();
}
$('#lockForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#err').textContent = '확인 중…';
  try { await unlock($('#pw').value, $('#keep').checked); $('#err').textContent = ''; }
  catch (x) { $('#err').textContent = '비밀번호가 맞지 않습니다'; }
});
$('#logout').onclick = () => { ls(KEY, null); location.reload(); };
if (ls(KEY)) unlock(ls(KEY), true).catch(() => ls(KEY, null));
window.addEventListener('beforeunload', e => { if (S.dirty.size) { e.preventDefault(); e.returnValue = ''; } });
let lastPC = null;
function applyMode() { const pc = isPC(); document.body.classList.toggle('pc', pc); if (!pc) S.edit = false; if (DB && lastPC !== null && lastPC !== pc) render(); lastPC = pc; }
window.addEventListener('resize', applyMode); applyMode();

/* ---------- data prep ---------- */
function startDate(e) { const m = String(e.date || '').match(/^(\d+)\/(\d+)/); return m ? new Date(e.y, +m[1] - 1, +m[2]) : new Date(e.y, (e.m || 1) - 1, 1); }
function endDate(e) { const m = String(e.date || '').match(/~\s*(?:(\d+)\/)?(\d+)\s*$/); const s = startDate(e); if (!m) return s; return new Date(e.y, m[1] ? +m[1] - 1 : s.getMonth(), +m[2]); }
const norm = (s) => String(s || '').replace(/\(.*?\)|\s|[·,]/g, '').toLowerCase();
function prep() {
  DB.events.forEach(e => {
    e._s = startDate(e); e._e = endDate(e);
    e._done = e.amt != null || e.cnt != null || e.closeAmt != null || ((e.tag === '사전점검' || e.tag === '내부') && e._e < TODAY);
    e._st = e._done ? 'done' : (e._e < TODAY ? 'wait' : 'plan');
    e._rate = pct(e.amt, e.target); e._n = norm(e.name);
  });
  DB.apts.forEach(a => {
    a.mg = a.mg || {};
    a._n = norm(a.name);
    a._ev = DB.events.filter(e => e.aptId === a.id || (!e.aptId && a._n.length > 5 && (e._n.includes(a._n) || (e._n.length > 5 && a._n.includes(e._n)))));
    a._plan = a._ev.find(e => e._st !== 'done');
    const mm = (k) => { const t = a.m - k; return t < 1 ? `${String(a.y - 1).slice(2)}.${t + 12}` : `${t}`; };
    a._recLabel = a.m ? `${mm(2)}~${mm(1)}월` : '';
    a._agg = agg(a._ev.filter(e => e._done));
    a._st = a.mg.status || (a._ev.some(e => e._done) ? '진행완료' : a._plan ? '박람회확정' : '미착수');
  });
  S.maxAptYear = Math.max(...DB.apts.map(a => a.y));
  if (!S.aptYear) S.aptYear = S.maxAptYear;
  $('#upd').textContent = '데이터 기준 ' + DB.meta.updated + ' · 금액 백만원';
}
function agg(rows) {
  const s = (k) => rows.reduce((t, e) => t + (Number(e[k]) || 0), 0);
  const withT = rows.filter(e => e.target && e.amt != null);
  const tgt = withT.reduce((t, e) => t + e.target, 0), amtT = withT.reduce((t, e) => t + e.amt, 0);
  return { n: rows.filter(e => e.tag !== '사전점검' && e.tag !== '내부').length, hh: s('hh'), target: s('target'), cnt: s('cnt'), amt: s('amt'),
    rate: pct(amtT, tgt), unit: s('cnt') ? s('amt') / s('cnt') : null, closeCnt: s('closeCnt'), closeAmt: s('closeAmt'), dvmCnt: s('dvmCnt'), dvmAmt: s('dvmAmt') };
}
const rateCls = (r) => r == null ? 'n' : r >= 100 ? 'g' : r >= 60 ? 'w' : 'b';
const rateColor = (r) => r == null ? '#cbc2b0' : r >= 100 ? 'var(--navy)' : r >= 60 ? '#a98a55' : 'var(--red)';
const years = () => [...new Set(DB.events.map(e => e.y))].sort();
const sidoS = (s) => ({'대전광역시': '대전', '충청북도': '충북', '충청남도': '충남', '세종특별자치시': '세종'})[s] || s;

/* ---------- nav ---------- */
const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  apt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 21h8V9l-8-3"/><path d="M8 8h.01M8 12h.01M8 16h.01M16 12h.01M16 16h.01"/></svg>'
};
const TABS = [['home', '요약'], ['list', '박람회 실적'], ['plan', '일정'], ['apt', '입주단지 관리']];
function renderTabs() {
  const pc = document.body.classList.contains('pc');
  $('#tabs').innerHTML = (pc ? `<div class="brand side-only"><span class="mbadge" style="flex-basis:44px;height:44px;border-radius:13px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 21h8V9l-8-3"/><path d="M8 8h.01M8 12h.01M8 16h.01M16 12h.01M16 16h.01"/></svg></span><div><b>충청 입주박람회 관리</b><small>${esc(DB.meta.updated)} 기준 · 백만원</small></div></div>` : '')
    + TABS.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${ICON[k]}<span>${l}</span></button>`).join('')
    + (pc ? `<div class="sidebox side-only">
        <div class="switch ${S.edit ? 'on' : ''}" id="editSw"><span>편집 모드</span><i></i></div>
        ${S.edit ? `<div style="margin:8px 2px 0;line-height:1.5">행을 클릭하면 오른쪽에서 수정합니다.</div>` : ''}
        ${S.dirty.size ? `<div class="savebox"><b>${repoInfo().token ? '저장 중이거나 실패한 변경' : '저장 안 된 변경'} ${S.dirty.size}건</b><div style="display:flex;gap:6px;margin-top:8px"><button class="btn blue sm" id="saveGh">${repoInfo().token ? '다시 저장' : 'GitHub에 저장'}</button><button class="btn sm" id="saveFile">파일 받기</button></div></div>` : ''}
        <div style="display:flex;gap:6px;margin-top:12px"><button class="btn sm" id="ghSet">${repoInfo().token ? '자동 저장 켜짐' : '자동 저장 켜기'}</button><button class="btn sm" id="lockBtn">잠금</button></div>
      </div>` : '');
  $$('#tabs button[data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); scrollTo(0, 0); });
  const sw = $('#editSw'); if (sw) sw.onclick = () => { S.edit = !S.edit; render(); };
  const sg = $('#saveGh'); if (sg) sg.onclick = saveGitHub;
  const sf = $('#saveFile'); if (sf) sf.onclick = saveFile;
  const gs = $('#ghSet'); if (gs) gs.onclick = ghSettings;
  const lb = $('#lockBtn'); if (lb) lb.onclick = () => { if (S.dirty.size && !confirm('저장 안 된 변경이 있습니다. 잠글까요?')) return; S.dirty.clear(); ls(KEY, null); location.reload(); };
}
function render() {
  renderTabs();
  const pc = document.body.classList.contains('pc');
  const v = $('#view');
  v.innerHTML = ({ home: vHome, list: pc ? vListPC : vList, plan: vPlan, apt: pc ? vAptPC : vApt })[S.tab]();
  bind(v);
}
function bind(v) {
  $$('[data-year]', v).forEach(b => b.onclick = () => { S.year = b.dataset.year === 'all' ? 'all' : +b.dataset.year; render(); });
  $$('[data-ay]', v).forEach(b => b.onclick = () => { S.aptYear = +b.dataset.ay; S.aptMonth = 0; render(); });
  $$('[data-ev]', v).forEach(b => b.onclick = () => openEvent(b.dataset.ev));
  $$('[data-apt]', v).forEach(b => b.onclick = () => openApt(b.dataset.apt));
  $$('[data-am]', v).forEach(b => b.onclick = () => { S.aptMonth = +b.dataset.am === S.aptMonth ? 0 : +b.dataset.am; render(); });
  $$('[data-sido]', v).forEach(b => b.onclick = () => { S.aptSido = b.dataset.sido; render(); });
  $$('[data-ast]', v).forEach(b => b.onclick = () => { S.aptSt = b.dataset.ast; render(); });
  $$('[data-goto]', v).forEach(b => b.onclick = (e) => { e.preventDefault(); S.tab = b.dataset.goto; render(); scrollTo(0, 0); });
  const nb = $('#newEv', v); if (nb) nb.onclick = () => openEvent(null);
  const na = $('#newApt', v); if (na) na.onclick = () => openApt(null);
  for (const [id, k] of [['q', 'q'], ['aq', 'aptQ']]) {
    const q = $('#' + id, v); if (!q) continue;
    q.oninput = () => { S[k] = q.value; const p = q.selectionStart; render(); const n = $('#' + id); n.focus(); n.setSelectionRange(p, p); };
  }
}
const yearChips = (all) => `<div class="chips">${all ? `<button class="chip ${S.year === 'all' ? 'on' : ''}" data-year="all">전체</button>` : ''}${years().map(y => `<button class="chip ${S.year === y ? 'on' : ''}" data-year="${y}">${String(y).slice(2)}년</button>`).join('')}</div>`;

/* ---------- 요약 ---------- */
function vHome() {
  if (S.year === 'all') S.year = Math.max(...years());
  const pc = document.body.classList.contains('pc');
  const done = DB.events.filter(e => e.y === S.year && e._done);
  const a = agg(done);
  const maxV = Math.max(1, ...Array.from({length: 12}, (_, i) => { const r = agg(done.filter(e => e.m === i + 1)); return Math.max(r.amt, r.target); }));
  const chart = Array.from({length: 12}, (_, i) => {
    const r = agg(done.filter(e => e.m === i + 1));
    return `<div class="col" title="${i + 1}월 목표 ${fmt(r.target)} / 판매 ${fmt(r.amt)}"><div class="stack">${r.target ? `<div class="tg" style="height:${r.target / maxV * 120}px"></div>` : ''}<div class="am ${r.amt >= r.target && r.amt ? 'over' : ''}" style="height:${r.amt / maxV * 120}px"></div></div><div class="lb">${i + 1}</div></div>`;
  }).join('');
  const upcoming = DB.events.filter(e => e._st !== 'done').sort((x, y) => x._s - y._s).slice(0, pc ? 6 : 4);
  const cmp = years().map(y => { const r = agg(DB.events.filter(e => e.y === y && e._done)); return `<tr><td class="l"><b>${String(y).slice(2)}년</b></td><td>${fmt(r.n)}</td><td>${fmt(r.hh)}</td><td>${fmt(r.target)}</td><td>${fmt(r.amt)}</td><td><span class="rate ${rateCls(r.rate)}">${fmt(r.rate)}%</span></td><td>${fmt(r.unit, 1)}</td><td>${fmt(r.dvmAmt)}</td></tr>`; }).join('');
  const hosts = {};
  done.filter(e => e.host && e.target).forEach(e => { const k = e.host.replace(/\(.*\)/, ''); (hosts[k] = hosts[k] || []).push(e); });
  const hostRows = Object.entries(hosts).map(([k, r]) => [k, agg(r)]).sort((x, y) => (y[1].rate || 0) - (x[1].rate || 0))
    .map(([k, r]) => `<tr><td class="l">${esc(k)}</td><td>${r.n}</td><td>${fmt(r.hh)}</td><td>${fmt(r.amt)}</td><td><span class="rate ${rateCls(r.rate)}">${fmt(r.rate)}%</span></td><td>${fmt(r.hh ? r.amt / r.hh * 100 : null, 1)}</td></tr>`).join('');
  const upHtml = pc
    ? `<div class="tblwrap" style="max-height:none"><table class="tbl num"><thead><tr><th class="l">일정</th><th class="l">단지</th><th class="l">주관사</th><th>세대</th><th class="l">상태</th></tr></thead><tbody>${upcoming.map(e => `<tr class="click" data-ev="${e.id}"><td class="l">${String(e.y).slice(2)}.${esc(e.date)}</td><td class="l">${esc(e.name)}</td><td class="l">${esc(e.host || '')}</td><td>${fmt(e.hh)}</td><td class="l">${statusTag(e)}</td></tr>`).join('')}</tbody></table></div>`
    : `<div class="list">${upcoming.map(evCard).join('') || '<div class="empty">예정된 박람회가 없습니다</div>'}</div>`;
  return `
  ${pc ? `<div class="pagehead"><div><h2>${S.year}년 박람회 요약</h2><p>완료 ${a.n}건 기준 · 본사전산 판매금액(부가세별도)</p></div>${yearChips(false)}</div>` : yearChips(false) + `<h2 class="sec">${S.year}년 박람회 실적 <small>완료 ${a.n}건 기준</small></h2>`}
  <div class="kpis k5">
    <div class="kpi hero"><div class="l">판매금액 (본사전산, 부가세별도)</div>
      <div class="v num">${fmt(a.amt)}<small>백만원</small> <span class="rt">달성 ${fmt(a.rate)}%</span></div>
      <div class="bar"><i style="width:${Math.min(100, a.rate || 0)}%"></i></div>
      <div class="s">목표 ${fmt(a.target)} 백만원 · 판매 ${fmt(a.cnt)}건</div></div>
    <div class="kpi"><div class="l">박람회</div><div class="v num">${fmt(a.n)}<small>건</small></div><div class="s">대상 ${fmt(a.hh)}세대</div></div>
    <div class="kpi"><div class="l">객단가</div><div class="v num">${fmt(a.unit, 1)}<small>백만원</small></div><div class="s">판매금액 ÷ 판매건수</div></div>
    <div class="kpi"><div class="l">가전 실판매 마감</div><div class="v num">${fmt(a.closeAmt)}<small>백만원</small></div><div class="s">${a.closeCnt ? fmt(a.closeCnt) + '건 · ' : ''}부가세포함</div></div>
    <div class="kpi"><div class="l">DVM</div><div class="v num">${fmt(a.dvmAmt)}<small>백만원</small></div><div class="s">${fmt(a.dvmCnt)}건</div></div>
  </div>
  <div class="grid2">
    <div><h2 class="sec">월별 판매 vs 목표 <small>백만원</small></h2>
      <div class="card"><div class="mchart">${chart}</div>
      <div class="legend"><span><i style="background:#7c7a8a"></i>판매금액</span><span><i style="background:var(--navy)"></i>목표 달성</span><span><i style="border:1.5px dashed var(--crop)"></i>목표</span></div></div></div>
    <div><h2 class="sec">다가오는 일정 <small><a href="#" data-goto="plan" >전체 보기 ›</a></small></h2>${upHtml}</div>
  </div>
  <div class="grid2">
    <div><h2 class="sec">연도별 비교 <small>실적 있는 박람회만</small></h2>
      <div class="card scrollx" style="padding:4px 6px"><table class="tbl num"><thead><tr><th class="l">연도</th><th>건수</th><th>세대</th><th>목표</th><th>판매</th><th>달성률</th><th>객단가</th><th>DVM</th></tr></thead><tbody>${cmp}</tbody></table></div></div>
    <div>${hostRows ? `<h2 class="sec">주관사별 성과 (${S.year}년) <small>세대당 = 판매 ÷ 세대 (만원)</small></h2>
      <div class="card scrollx" style="padding:4px 6px"><table class="tbl num"><thead><tr><th class="l">주관사</th><th>건수</th><th>세대</th><th>판매</th><th>달성률</th><th>세대당</th></tr></thead><tbody>${hostRows}</tbody></table></div>` : ''}</div>
  </div>
  <div class="foot">· 합계는 각 박람회 행을 더해 계산합니다. 원본 시트의 월 합계 셀과 일부 다를 수 있습니다(예: 24년 2월 DVM, 25년 마감건수).<br>· 달성률 = 판매금액 ÷ 목표 (목표가 있는 박람회만).</div>`;
}

/* ---------- 실적: 모바일 카드 ---------- */
function statusTag(e) {
  if (e._st === 'plan') return `<span class="tag t-blue">예정</span>${e.tag === '미확정' ? '<span class="tag t-warn">미확정</span>' : ''}`;
  if (e._st === 'wait') return '<span class="tag t-warn">실적 입력 대기</span>';
  return '';
}
function evTags(e) {
  return [e.cha === 2 ? '<span class="tag t-gray">2차</span>' : '', e.tag && e.tag !== '미확정' ? `<span class="tag ${/SDP/.test(e.tag) ? 't-red' : /가구/.test(e.tag) ? 't-green' : 't-gray'}">${esc(e.tag)}</span>` : '', statusTag(e)].join('');
}
function evCard(e) {
  const meta = [`${String(e.y).slice(2)}년 ${esc(e.date)}${e.days ? ` (${e.days}일)` : ''}`, e.host && esc(e.host), e.venue && esc(e.venue), e.moveIn && `입주 ${esc(e.moveIn)}`].filter(Boolean).join(' · ');
  const r = e._rate;
  return `<div class="ev" data-ev="${e.id}">
    <div class="r1"><div><div class="nm">${evTags(e)}${esc(e.name)}</div><div class="meta">${meta}</div></div>
    <div class="rate ${rateCls(r)}">${r != null ? fmt(r) + '%' : (e._done ? '' : '')}</div></div>
    ${e._done || e.hh ? `<div class="nums num">${e.hh ? `<span>세대<b>${fmt(e.hh)}</b></span>` : ''}${e.target ? `<span>목표<b>${fmt(e.target)}</b></span>` : ''}${e.amt != null ? `<span>판매<b>${fmt(e.amt)}</b></span>` : ''}${e.cnt != null ? `<span>건수<b>${fmt(e.cnt)}</b></span>` : ''}${e.dvmAmt ? `<span>DVM<b>${fmt(e.dvmAmt)}</b></span>` : ''}</div>` : ''}
    ${r != null ? `<div class="pbar"><i style="width:${Math.min(100, r)}%;background:${rateColor(r)}"></i></div>` : ''}
  </div>`;
}
function filteredEvents() {
  const q = norm(S.q);
  return DB.events.filter(e => (S.year === 'all' || e.y === S.year) && (!q || e._n.includes(q) || norm(e.host).includes(q) || norm(e.venue).includes(q)));
}
function groupByMonth(rows) { const g = {}; rows.forEach(e => { const k = e.y * 100 + e.m; (g[k] = g[k] || []).push(e); }); return g; }
function vList() {
  const rows = filteredEvents().sort((a, b) => b._s - a._s), g = groupByMonth(rows);
  const body = Object.keys(g).sort((a, b) => b - a).map(k => {
    const r = g[k], a = agg(r.filter(e => e._done));
    return `<div class="mhead"><div>${String(Math.floor(k / 100)).slice(2)}년 ${k % 100}월</div><span class="num">${a.n}건 · 판매 ${fmt(a.amt)} / 목표 ${fmt(a.target)}${a.rate != null ? ` · ${fmt(a.rate)}%` : ''}</span></div><div class="list">${r.map(evCard).join('')}</div>`;
  }).join('');
  return `${yearChips(true)}<input id="q" class="search" placeholder="단지명 · 주관사 · 장소 검색" value="${esc(S.q)}">${body || '<div class="empty">검색 결과가 없습니다</div>'}`;
}
/* ---------- 실적: PC 표 ---------- */
function vListPC() {
  const rows = filteredEvents().sort((a, b) => a._s - b._s), g = groupByMonth(rows);
  const tot = agg(rows.filter(e => e._done));
  const body = Object.keys(g).sort((a, b) => a - b).map(k => {
    const r = g[k], a = agg(r.filter(e => e._done));
    return `<tr class="mrow"><td class="l" colspan="6">${String(Math.floor(k / 100)).slice(2)}년 ${k % 100}월 · ${a.n}건</td><td>${fmt(a.hh)}</td><td>${fmt(a.target)}</td><td>${fmt(a.amt)}</td><td>${fmt(a.cnt)}</td><td>${a.rate != null ? fmt(a.rate) + '%' : ''}</td><td>${fmt(a.unit, 1)}</td><td>${fmt(a.closeAmt)}</td><td>${fmt(a.dvmCnt)}</td><td>${fmt(a.dvmAmt)}</td></tr>`
      + r.map(e => `<tr class="click ${S.dirty.has(e.id) ? 'dirty' : ''}" data-ev="${e.id}"><td class="l">${esc(e.date)}</td><td class="l">${e.wk ? esc(e.wk) : ''}</td><td class="l wrap">${evTags(e)}${esc(e.name)}</td><td class="l">${esc(e.host || '')}</td><td class="l">${esc(e.venue || '')}</td><td class="l">${esc(e.moveIn || '')}</td><td>${fmt(e.hh)}</td><td>${fmt(e.target)}</td><td><b>${fmt(e.amt)}</b></td><td>${fmt(e.cnt)}</td><td><span class="rate ${rateCls(e._rate)}">${e._rate != null ? fmt(e._rate) + '%' : ''}</span></td><td>${fmt(e.unit, 1)}</td><td>${fmt(e.closeAmt)}</td><td>${fmt(e.dvmCnt)}</td><td>${fmt(e.dvmAmt)}</td></tr>`).join('');
  }).join('');
  return `<div class="pagehead"><div><h2>박람회 실적</h2><p>${S.year === 'all' ? '전체' : S.year + '년'} · 완료 ${tot.n}건 · 판매 ${fmt(tot.amt)} / 목표 ${fmt(tot.target)} (${fmt(tot.rate)}%) · 단위 백만원</p></div>
    <div class="toolbar">${yearChips(true)}<input id="q" class="search" placeholder="단지명 · 주관사 · 장소 검색" value="${esc(S.q)}">${S.edit ? '<button class="btn pri" id="newEv">+ 박람회 추가</button>' : ''}</div></div>
  <div class="tblwrap"><table class="tbl num"><thead><tr><th class="l">일정</th><th class="l">주차</th><th class="l">단지 / 박람회</th><th class="l">주관사</th><th class="l">장소</th><th class="l">입주</th><th>세대</th><th>목표</th><th>판매금액</th><th>건수</th><th>달성률</th><th>객단가</th><th>실판매마감</th><th>DVM건</th><th>DVM</th></tr></thead><tbody>${body || '<tr><td colspan="15" class="l empty">검색 결과가 없습니다</td></tr>'}</tbody></table></div>`;
}

/* ---------- 일정 ---------- */
function vPlan() {
  const pc = document.body.classList.contains('pc');
  const plan = DB.events.filter(e => e._st !== 'done').sort((a, b) => a._s - b._s);
  const wait = plan.filter(e => e._st === 'wait'), fut = plan.filter(e => e._st === 'plan');
  const ny = S.maxAptYear;
  const soon = DB.apts.filter(a => a.y === ny && !a._ev.length && a.m <= 4 && a._st === '미착수').sort((a, b) => a.m - b.m || b.hh - a.hh);
  return `
  ${pc ? `<div class="pagehead"><div><h2>일정</h2><p>실적 입력이 필요한 박람회와 앞으로의 일정${S.edit ? ' · 카드를 눌러 실적 입력' : ''}</p></div>${S.edit ? '<button class="btn pri" id="newEv">+ 박람회 추가</button>' : ''}</div>` : ''}
  <h2 class="sec">실적 입력 대기 <small>일정은 지났고 실적이 없는 박람회</small></h2>
  <div class="list">${wait.map(evCard).join('') || '<div class="empty">없음</div>'}</div>
  <h2 class="sec">예정 박람회 <small>${fut.length}건</small></h2>
  <div class="list">${fut.map(evCard).join('') || '<div class="empty">없음</div>'}</div>
  <h2 class="sec">${String(ny).slice(2)}년 1~4월 입주 · 박람회 미배정 <small>입주 1~2개월 전 개최가 일반적</small></h2>
  <div class="list">${soon.map(aptCard).join('') || '<div class="empty">없음</div>'}</div>
  <div class="foot">· 26년 박람회는 평균 입주 1~2개월 전에 열렸습니다(26년 실적 기준).</div>`;
}

/* ---------- 입주단지 ---------- */
function aptStatus(a) {
  if (a._plan) return `<span class="tag t-blue">박람회 ${esc(a._plan.date)}</span>`;
  if (a.mg.status && a.mg.status !== '미착수') return `<span class="tag ${ST_CLS[a.mg.status]}">${esc(a.mg.status)}</span>${a.mg.fairDate ? `<span class="tag t-gray">${esc(a.mg.fairDate)}</span>` : ''}`;
  if (a._ev.some(e => e._done)) { const g = a._agg; return `<span class="tag t-green">박람회 ${a._ev.filter(e => e._done).length}회</span>${g.amt ? `<span class="tag t-gray">판매 ${fmt(g.amt)}${g.rate != null ? ' · ' + fmt(g.rate) + '%' : ''}</span>` : ''}`; }
  if (a._ev.length) return '<span class="tag t-green">진행 이력</span>';
  return a._recLabel ? `<span class="tag t-gray">박람회 권장 ${a._recLabel}</span>` : '';
}
function aptCard(a) {
  return `<div class="apt" data-apt="${a.id}"><div class="mo">${a.m ? `${a.m}<small>월</small>` : `<small style="margin:0">${String(a.y).slice(2)}년</small>`}</div>
    <div class="bd"><div class="nm">${esc(a.name)}</div><div class="meta">${esc(sidoS(a.sido))} ${esc(a.sigungu)} ${esc(a.dong)} · ${esc(a.type)}</div><div style="margin-top:5px">${aptStatus(a)}${a.flag ? '<span class="tag t-warn">시트 표시</span>' : ''}</div></div>
    <div class="rt num"><b>${fmt(a.hh)}</b>세대</div></div>`;
}
function aptBase() {
  const q = norm(S.aptQ);
  return DB.apts.filter(a => a.y === S.aptYear && (S.aptSido === '전체' || a.sido === S.aptSido) && (S.aptSt === '전체' || a._st === S.aptSt) && (!q || a._n.includes(q) || norm(a.sigungu + a.dong).includes(q)));
}
function aptFilters() {
  const ys = [...new Set(DB.apts.map(a => a.y))].sort();
  const sidos = ['전체', ...new Set(DB.apts.filter(a => a.y === S.aptYear).map(a => a.sido))];
  return `${ys.length > 1 ? `<div class="chips">${ys.map(y => `<button class="chip ${S.aptYear === y ? 'on' : ''}" data-ay="${y}">${String(y).slice(2)}년 입주</button>`).join('')}</div>` : ''}
    <div class="chips">${sidos.map(s => `<button class="chip ${S.aptSido === s ? 'on' : ''}" data-sido="${esc(s)}">${esc(sidoS(s)) || '지역 미상'}</button>`).join('')}</div>
    <div class="chips">${['전체', ...APT_ST].map(s => `<button class="chip ${S.aptSt === s ? 'on' : ''}" data-ast="${s}">${s}</button>`).join('')}</div>`;
}
function monthGrid(base) {
  const unk = base.filter(a => !a.m);
  if (unk.length && unk.length === base.length) return `<div class="note" style="margin:0">${S.aptYear}년 단지는 원본 실적 시트에 입주월이 없어 월별로 나누지 않았습니다. PC 편집 모드에서 입주월을 입력하면 월별로 정리됩니다.</div>`;
  return `<div class="mgrid">${Array.from({length: 12}, (_, i) => { const r = base.filter(a => a.m === i + 1); return `<div class="mcell ${S.aptMonth === i + 1 ? 'on' : ''} ${r.length ? '' : 'zero'}" data-am="${i + 1}"><div class="m">${i + 1}월</div><div class="c">${r.length}</div><div class="h num">${r.length ? fmt(r.reduce((t, a) => t + a.hh, 0)) : '–'}</div></div>`; }).join('')}</div>`;
}
function aptSummary(rows) {
  const tot = rows.reduce((t, a) => t + a.hh, 0);
  const byType = ['분양', '임대', '조합'].map(t => { const r = rows.filter(a => a.type === t); return r.length ? `${t} ${r.length}` : ''; }).filter(Boolean).join(' · ');
  const bySt = APT_ST.map(s => { const n = rows.filter(a => a._st === s).length; return n ? `${s} ${n}` : ''; }).filter(Boolean).join(' · ');
  const g = agg(rows.flatMap(a => a._ev.filter(e => e._done)));
  return `<div class="kpi hero"><div class="l">${S.aptYear}년 충청 입주${S.aptYear > TODAY.getFullYear() ? ' 예정' : ''} 단지${S.aptSido !== '전체' ? ' · ' + esc(sidoS(S.aptSido)) : ''}${S.aptMonth ? ' · ' + S.aptMonth + '월' : ''}</div>
      <div class="v num">${rows.length}<small>개 단지</small> <span style="font-size:18px;margin-left:6px">${fmt(tot)}<small>세대</small></span></div>
      <div class="s">${byType}${bySt ? ' | ' + bySt : ''}${g.amt ? ` | 박람회 판매 ${fmt(g.amt)} / 목표 ${fmt(g.target)}${g.rate != null ? ` (${fmt(g.rate)}%)` : ''}` : ''}</div></div>`;
}
function vApt() {
  const base = aptBase(), rows = base.filter(a => !S.aptMonth || a.m === S.aptMonth);
  return `<div class="kpis" style="margin-bottom:12px">${aptSummary(rows)}</div>${monthGrid(base)}
  <div style="margin-top:12px;display:grid;gap:6px">${aptFilters()}</div>
  <input id="aq" class="search" placeholder="단지명 · 지역 검색" value="${esc(S.aptQ)}">
  <div class="list" style="margin-top:12px">${rows.sort((a, b) => (a.m || 0) - (b.m || 0) || b.hh - a.hh).map(aptCard).join('') || '<div class="empty">해당 단지가 없습니다</div>'}</div>
  <div class="foot">· 출처: 27년 = 뉴홈 연간 카렌다(통합 관리 시트) · 24~26년 = 박람회 실적 시트에서 단지 추출(지역은 단지명으로 추정)<br>· ‘시트 표시’ = 원본 시트의 외부박람회(1차) 칸이 주황색으로 칠해진 단지입니다.</div>`;
}
function vAptPC() {
  const base = aptBase(), rows = base.filter(a => !S.aptMonth || a.m === S.aptMonth).sort((a, b) => (a.m || 0) - (b.m || 0) || b.hh - a.hh);
  const fairOf = (a) => a._plan ? `${String(a._plan.y).slice(2)}.${esc(a._plan.date)}` : (a.mg.fairDate ? esc(a.mg.fairDate) : (a._ev.find(e => e._done) ? a._ev.filter(e => e._done).map(e => `${String(e.y).slice(2)}.${esc(e.date)}${e.cha === 2 ? '(2차)' : ''}`).join(', ') : (a._recLabel ? `<span style="color:var(--mute)">권장 ${a._recLabel}</span>` : '')));
  const hostOf = (a) => esc(a._plan?.host || a.mg.host || a._ev[0]?.host || '');
  const tr = rows.map(a => `<tr class="click ${S.dirty.has(a.id) ? 'dirty' : ''}" data-apt="${a.id}"><td>${a.m ? a.m + '월' : '–'}</td><td class="l"><b>${esc(a.name)}</b>${a.flag ? ' <span class="tag t-warn">시트</span>' : ''}</td><td class="l">${esc(sidoS(a.sido))} ${esc(a.sigungu)} ${esc(a.dong)}</td><td class="l">${esc(a.type)}</td><td>${fmt(a.hh)}</td><td class="l"><span class="tag ${ST_CLS[a._st]}">${a._st}</span></td><td class="l">${fairOf(a)}</td><td>${a._agg.amt ? fmt(a._agg.amt) : ''}</td><td>${a._agg.rate != null ? `<span class="rate ${rateCls(a._agg.rate)}">${fmt(a._agg.rate)}%</span>` : ''}</td><td class="l">${hostOf(a)}</td><td class="l">${esc(a.mg.invite || '')}</td><td class="l">${esc((a.mg.stores || '').slice(0, 24))}</td><td class="l" style="max-width:240px;overflow:hidden;text-overflow:ellipsis">${esc(a.mg.memo || '')}</td></tr>`).join('');
  return `<div class="pagehead"><div><h2>입주단지 관리</h2><p>입주 예정 단지별 박람회·고객초청·배정점 관리${S.edit ? ' · 행을 클릭해 수정' : ''}</p></div>
    <div class="toolbar"><input id="aq" class="search" placeholder="단지명 · 지역 검색" value="${esc(S.aptQ)}">${S.edit ? '<button class="btn pri" id="newApt">+ 단지 추가</button>' : ''}</div></div>

  </ol>
  <div class="note" style="white-space:normal">열쇠는 이 PC 브라우저에만 보관되고 GitHub 파일에는 들어가지 않습니다. 이 저장소 하나에만 쓰기 권한이 있어 다른 저장소는 건드릴 수 없습니다. 휴대폰은 보기 전용이라 넣지 않아도 됩니다.</div>
  <form class="form" id="gf">${F('token', '열쇠 (토큰)', r.token, {w: 6, ph: 'github_pat_...'})}<details class="f w6" style="font-size:13px;color:var(--sub)"><summary style="cursor:pointer">저장소 정보 (보통 자동으로 채워짐)</summary><div class="form" style="margin-top:8px">${F('owner', 'GitHub 계정', r.owner || 'pegasus0710-arch', {w: 3})}${F('repo', '저장소', r.repo || 'ipju-fair', {w: 3})}</div></details></form>
  <div class="formbar"><button class="btn danger" id="gClear">열쇠 지우기</button><div style="display:flex;gap:8px"><button class="btn" id="cancel">닫기</button><button class="btn pri" id="gSave">켜기</button></div></div>`);
  $('#cancel').onclick = closeSheet;
  $('#gClear').onclick = () => { ls(TKEY, null); closeSheet(); toast('열쇠를 지웠습니다 · 자동 저장 꺼짐'); };
  $('#gSave').onclick = () => { const fd = Object.fromEntries(new FormData($('#gf'))); ls(TKEY, JSON.stringify({ owner: fd.owner.trim(), repo: fd.repo.trim(), token: fd.token.trim() })); closeSheet(); render();
    if (S.dirty.size) saveGitHub(); else toast('자동 저장을 켰습니다 · 이제 「적용」만 누르면 저장됩니다'); };
}
async function saveGitHub() {
  const r = repoInfo();
  if (!r.token || !r.owner || !r.repo) return ghSettings();
  const btn = $('#saveGh'); if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
  try {
    const api = `https://api.github.com/repos/${r.owner}/${r.repo}/contents/data.enc.json`;
    const H = { Authorization: `Bearer ${r.token}`, Accept: 'application/vnd.github+json' };
    const cur = await fetch(api + '?ref=main&t=' + Date.now(), { headers: H, cache: 'no-store' });
    if (!cur.ok) throw new Error('파일 조회 실패 (' + cur.status + ')');
    const sha = (await cur.json()).sha;
    const content = await encrypt(cleanDB());
    const res = await fetch(api, { method: 'PUT', headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `데이터 수정 (${S.dirty.size}건)`, content: btoa(unescape(encodeURIComponent(content))), sha, branch: 'main' }) });
    if (!res.ok) throw new Error('저장 실패 (' + res.status + ')');
    DB.meta.updated = cleanDB().meta.updated; S.dirty.clear(); prep(); render();
    toast('GitHub에 저장했습니다 · 1~2분 뒤 모든 기기에 반영');
  } catch (err) { toast(err.message + (/40[13]/.test(err.message) ? ' · 열쇠가 틀렸거나 기간이 끝났습니다' : ' · 잠시 뒤 「다시 저장」을 눌러 주세요')); if (btn) { btn.disabled = false; btn.textContent = 'GitHub에 저장'; } }
}
async function saveFile() {
  const content = await encrypt(cleanDB());
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type: 'application/json' })); a.download = 'data.enc.json'; a.click();
  toast('data.enc.json 을 저장소에 덮어 올리면 반영됩니다');
}
})();
</script>
